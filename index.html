<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friend Peanut | فريند بينت</title>
<link rel="icon" href="logo.jpeg">

<style>
:root{
  --green:#3fa91c;
  --green-dark:#1f4d2b;
  --green-soft:#eef6e4;
  --orange:#f59a0c;
  --gold:#c9a36b;
  --bg:#fbfdf7;
  --text:#2b3a2d;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.8}

/* NAV */
nav{
  position:fixed;top:0;width:100%;z-index:1000;
  background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  box-shadow:0 2px 18px rgba(31,77,43,.12);
  padding:8px 40px;display:flex;justify-content:space-between;align-items:center;gap:16px;
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--green)}
.brand span{font-weight:800;color:var(--green-dark);font-size:18px;letter-spacing:1px}
nav .links{display:flex;flex-wrap:wrap}
nav .links a{
  color:var(--green-dark);margin:0 12px;text-decoration:none;font-weight:600;position:relative;
}
nav .links a::after{
  content:"";position:absolute;bottom:-6px;left:0;width:0;height:2px;background:var(--orange);transition:.3s;
}
nav .links a:hover,nav .links a.active{color:var(--green)}
nav .links a:hover::after,nav .links a.active::after{width:100%}
.lang-btn{
  background:var(--green);color:#fff;border:none;padding:8px 20px;border-radius:30px;
  cursor:pointer;font-weight:bold;transition:.3s;
}
.lang-btn:hover{background:var(--orange)}

/* HERO */
#home{
  min-height:100vh;padding:120px 24px 60px;
  background:
    radial-gradient(circle at 15% 20%,rgba(63,169,28,.18),transparent 45%),
    radial-gradient(circle at 85% 80%,rgba(245,154,12,.14),transparent 40%),
    linear-gradient(180deg,#f4faea,#e7f3d6);
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
}
.hero-banner{
  width:100%;max-width:1100px;border-radius:24px;
  box-shadow:0 25px 60px rgba(31,77,43,.22);
  border:6px solid #fff;
}
#home p{font-size:20px;color:var(--green-dark);margin:28px 0 20px;font-weight:600}
.btn{
  display:inline-block;padding:13px 34px;border-radius:40px;text-decoration:none;
  font-weight:700;margin:6px;transition:.3s;
}
.btn.primary{background:var(--green-dark);color:#fff}
.btn.primary:hover{background:var(--green)}
.btn.outline{border:2px solid var(--green-dark);color:var(--green-dark)}
.btn.outline:hover{background:var(--green-dark);color:#fff}

/* SECTIONS */
section{padding:90px 24px;text-align:center}
section:nth-of-type(even){background:var(--green-soft)}
h2{color:var(--green-dark);font-size:34px;margin:0 0 40px;position:relative;display:inline-block}
h2::after{
  content:"";display:block;width:60%;height:4px;margin:10px auto 0;border-radius:4px;
  background:linear-gradient(90deg,var(--green),var(--orange));
}

.card{
  max-width:900px;margin:auto;background:#fff;padding:36px;border-radius:22px;
  box-shadow:0 15px 35px rgba(31,77,43,.1);border-top:5px solid var(--green);
}

.products{
  max-width:900px;margin:auto;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;
}
.product{
  background:#fff;padding:30px 20px;border-radius:20px;font-weight:700;color:var(--green-dark);
  box-shadow:0 10px 25px rgba(31,77,43,.1);border-bottom:4px solid var(--orange);transition:.3s;
}
.product:hover{transform:translateY(-6px)}
.product i{display:block;font-style:normal;font-size:34px;margin-bottom:8px}

/* GALLERY */
.gallery{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.gallery img{
  width:100%;height:220px;object-fit:cover;border-radius:16px;transition:.4s;
  box-shadow:0 6px 16px rgba(0,0,0,.08);
}
.gallery img:hover{transform:scale(1.06);box-shadow:0 15px 30px rgba(31,77,43,.25)}

/* CONTACT */
.phone{direction:ltr;display:inline-block;font-weight:bold;color:var(--green)}
.contact-logo{width:120px;height:120px;border-radius:50%;object-fit:cover;margin-bottom:20px;border:3px solid var(--green)}

/* FOOTER */
footer{background:var(--green-dark);color:#e8f2dd;text-align:center;padding:28px;font-size:14px}
footer strong{color:var(--orange)}

@media(max-width:820px){
  nav{padding:8px 14px;flex-wrap:wrap;justify-content:center}
  nav .links a{margin:0 7px;font-size:14px}
  .brand span{display:none}
  h2{font-size:28px}
}
</style>
</head>

<script>
let currentLang="ar";

function setLanguage(lang){
  currentLang=lang;
  document.querySelectorAll("[data-ar]").forEach(el=>{
    el.innerText=el.getAttribute("data-"+lang);
  });
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.documentElement.lang=lang;
  document.getElementById("langBtn").innerText=lang==="ar"?"EN":"AR";
}

document.getElementById("langBtn").onclick=()=>{
  setLanguage(currentLang==="ar"?"en":"ar");
};

/* تفعيل الرابط النشط أثناء التمرير */
const secs=[...document.querySelectorAll("section")];
const links=[...document.querySelectorAll("nav .links a")];
window.addEventListener("scroll",()=>{
  let cur=secs[0].id;
  secs.forEach(s=>{ if(window.scrollY>=s.offsetTop-140) cur=s.id; });
  links.forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+cur));
});

document.addEventListener("DOMContentLoaded",()=>setLanguage("ar"));
</script>
