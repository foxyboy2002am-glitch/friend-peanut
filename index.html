<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14361f">
<title>Friend Peanut | فريند بينت</title>
<meta name="description" content="Friend Peanut – Premium peanuts from Egypt. Import, export & supply.">
<link rel="icon" href="logo.jpeg">
<link rel="preload" as="image" href="logo.jpeg">

<style>
:root{
  --g:#3fa91c; --gd:#14361f; --gm:#1f4d2b; --gs:#eef6e4; --o:#f59a0c;
  --bg:#fbfdf8; --tx:#26352a; --mu:#68776b;
  --r:24px; --sh:0 18px 45px rgba(20,54,31,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;font-family:"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.8;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1150px;margin:auto;padding:0 20px}

/* NAV */
header{position:fixed;inset:0 0 auto 0;z-index:100;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.bar{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:rgba(255,255,255,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.7);border-radius:60px;padding:7px 10px 7px 14px;box-shadow:0 8px 30px rgba(20,54,31,.14)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:800;color:var(--gm);letter-spacing:.5px}
.brand img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.links{display:flex;gap:4px}
.links a{text-decoration:none;font-weight:600;font-size:15px;padding:7px 14px;border-radius:30px;transition:.25s;color:var(--gm)}
.links a:hover,.links a.active{background:var(--gm);color:#fff}
.tools{display:flex;gap:8px;align-items:center}
.pill{border:0;cursor:pointer;font-weight:700;border-radius:30px;padding:9px 16px;background:var(--o);color:#fff;font-size:14px}
.burger{display:none;border:0;background:var(--gm);color:#fff;width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer}

/* HERO */
#home{position:relative;min-height:100svh;display:flex;align-items:center;text-align:center;color:#fff;overflow:hidden;
  background:radial-gradient(circle at 80% 10%,#2f8a1a 0,transparent 45%),radial-gradient(circle at 10% 90%,#f59a0c55 0,transparent 40%),linear-gradient(160deg,#0f2d19,#1f4d2b 60%,#2c6b25);
  padding:110px 0 70px}
#home::before,#home::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:float 9s ease-in-out infinite}
#home::before{width:280px;height:280px;background:#7fd13b;top:-60px;left:-60px}
#home::after{width:240px;height:240px;background:#f59a0c;bottom:-50px;right:-40px;animation-delay:-4s}
@keyframes float{50%{transform:translateY(30px) scale(1.1)}}
.hero-in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px}
.logo-hero{width:min(230px,56vw);aspect-ratio:1;border-radius:50%;object-fit:cover;border:6px solid rgba(255,255,255,.9);
  box-shadow:0 0 0 12px rgba(255,255,255,.12),0 25px 60px rgba(0,0,0,.35);animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.tag{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);padding:5px 16px;border-radius:30px;font-size:14px;backdrop-filter:blur(6px)}
#home h1{margin:0;font-size:clamp(34px,8vw,64px);letter-spacing:2px;line-height:1.15}
#home h1 em{font-style:normal;color:var(--o)}
#home p{margin:0;max-width:560px;font-size:clamp(16px,3.8vw,20px);opacity:.92}
.cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;padding:14px 28px;border-radius:50px;transition:.3s;border:2px solid transparent}
.btn.p{background:var(--o);color:#fff;box-shadow:0 10px 25px rgba(245,154,12,.4)}
.btn.p:hover{transform:translateY(-3px)}
.btn.s{border-color:rgba(255,255,255,.6);color:#fff}
.btn.s:hover{background:#fff;color:var(--gm)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px;width:100%;max-width:560px}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);border-radius:18px;padding:12px 6px}
.stat b{display:block;font-size:clamp(22px,6vw,32px);color:var(--o);line-height:1.2}
.stat span{font-size:13px;opacity:.9}

/* SECTIONS */
section{padding:84px 0}
.alt{background:var(--gs)}
.eyebrow{display:block;color:var(--g);font-weight:700;font-size:14px;letter-spacing:2px;text-align:center}
h2{margin:4px 0 38px;text-align:center;font-size:clamp(26px,6vw,38px);color:var(--gd)}
h2::after{content:"";display:block;width:70px;height:5px;border-radius:5px;margin:12px auto 0;background:linear-gradient(90deg,var(--g),var(--o))}
.card{background:#fff;border-radius:var(--r);padding:34px;box-shadow:var(--sh);text-align:center}
.about{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center}
.about .big{font-size:clamp(20px,4.5vw,26px);font-weight:700;color:var(--gm);line-height:1.6}
.about .pic{border-radius:var(--r);box-shadow:var(--sh);width:100%}

/* PRODUCTS */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.prod{background:#fff;border-radius:var(--r);padding:34px 22px;text-align:center;box-shadow:var(--sh);transition:.35s;position:relative;overflow:hidden}
.prod::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--g),var(--o))}
.prod:hover{transform:translateY(-8px)}
.ico{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:36px;background:var(--gs)}
.prod h3{margin:0;color:var(--gd);font-size:19px}

/* EXPORT */
.cert{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0}
.cert span{background:var(--gs);color:var(--gm);font-weight:700;padding:8px 18px;border-radius:30px;font-size:14px}
.cert-img{width:280px;border-radius:16px;box-shadow:var(--sh);margin:auto}
.banner{margin-top:34px;border-radius:var(--r);box-shadow:var(--sh);width:100%}

/* GALLERY */
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;justify-content:center;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--gm);background:transparent;color:var(--gm);font-weight:700;padding:8px 20px;border-radius:30px;cursor:pointer;font-size:14px;transition:.25s}
.chip.on{background:var(--gm);color:#fff}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;cursor:zoom-in;transition:.4s;box-shadow:0 6px 18px rgba(0,0,0,.1)}
.gallery img:hover{transform:scale(1.03)}
.lb{position:fixed;inset:0;background:rgba(8,20,12,.94);display:none;place-items:center;z-index:300;padding:16px}
.lb.show{display:grid}
.lb img{max-height:88vh;border-radius:14px}
.lb button{position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;width:46px;height:46px;border-radius:50%;border:0;font-size:22px;cursor:pointer;background:#fff}

/* CONTACT */
.contacts{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.person{background:#fff;border-radius:var(--r);padding:30px 22px;text-align:center;box-shadow:var(--sh)}
.avatar{width:70px;height:70px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,var(--g),var(--gm));color:#fff}
.person h3{margin:0;color:var(--gd)}
.person small{display:block;color:var(--mu);margin-bottom:12px}
.phone{direction:ltr;unicode-bidi:embed;display:inline-block;font-weight:800;color:var(--gm);font-size:18px}
.acts{display:flex;gap:8px;justify-content:center;margin-top:12px}
.acts a{flex:1;max-width:150px;text-decoration:none;text-align:center;font-weight:700;padding:10px;border-radius:30px;font-size:14px;color:#fff}
.call{background:var(--gm)} .wa{background:#25d366}
.info{margin-top:20px;text-align:center;color:var(--mu);display:flex;flex-direction:column;gap:4px}
.info a{color:var(--gm);font-weight:700;text-decoration:none;word-break:break-all}

footer{background:var(--gd);color:#d7e6cd;text-align:center;padding:22px 16px calc(24px + env(safe-area-inset-bottom));font-size:13px}
footer>img{width:48px;height:48px;border-radius:50%;margin:0 auto 8px}
footer strong{color:var(--o)}


/* DEV CREDIT */
.dev{direction:ltr;margin:8px auto 0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;opacity:.85}
.dev .lg{width:20px;height:20px;border-radius:50%;background:#fff;object-fit:cover;flex:0 0 auto}
.dev a{color:var(--o);font-weight:800;text-decoration:none;letter-spacing:.5px}
.dev a:hover{color:#fff}

/* FLOATING + BOTTOM BAR (mobile) */
.fab{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:90;width:58px;height:58px;border-radius:50%;background:#25d366;
  display:grid;place-items:center;box-shadow:0 10px 25px rgba(37,211,102,.5);text-decoration:none;font-size:28px}
.fab::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #25d366;animation:ping 2s infinite}
@keyframes ping{to{transform:scale(1.6);opacity:0}}

/* REVEAL */
.rv{opacity:0;transform:translateY(30px);transition:.8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

/* MOBILE */
@media(max-width:860px){
  .links{position:fixed;inset:78px 14px auto 14px;flex-direction:column;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);
    border-radius:26px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);transform:translateY(-14px);opacity:0;pointer-events:none;transition:.3s}
  .links.open{transform:none;opacity:1;pointer-events:auto}
  .links a{padding:13px 18px;font-size:17px}
  .burger{display:block}
  .brand span{font-size:15px}
  .grid3,.contacts,.about{grid-template-columns:1fr}
  section{padding:64px 0}
  .card{padding:26px 20px}
  .gallery{grid-template-columns:repeat(2,1fr);gap:10px}
  .gallery img{border-radius:14px}
  .chips{justify-content:flex-start}
  .btn{padding:13px 22px;width:100%;justify-content:center}
  .cta{width:100%;max-width:340px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

<script>
/* ===== Language ===== */
let lang="ar";
function setLanguage(l){
  lang=l;
  document.querySelectorAll("[data-ar]").forEach(e=>e.textContent=e.dataset[l]);
  document.documentElement.dir=l==="ar"?"rtl":"ltr";
  document.documentElement.lang=l;
  document.getElementById("langBtn").textContent=l==="ar"?"EN":"AR";
}
document.getElementById("langBtn").onclick=()=>setLanguage(lang==="ar"?"en":"ar");

/* ===== Mobile menu ===== */
const links=document.getElementById("links"),burger=document.getElementById("burger");
burger.onclick=()=>{links.classList.toggle("open");burger.textContent=links.classList.contains("open")?"✕":"☰"};
links.querySelectorAll("a").forEach(a=>a.onclick=()=>{links.classList.remove("open");burger.textContent="☰"});

/* ===== Gallery + lightbox ===== */
const cats=[["proc",1,9],["pack",10,13],["ship",14,18]],gal=document.getElementById("gal");
cats.forEach(([c,a,b])=>{for(let i=a;i<=b;i++){
  const im=new Image();im.src=i+".jpeg";im.alt="";im.loading="lazy";im.dataset.c=c;
  im.onerror=()=>im.remove();gal.appendChild(im);}});
document.getElementById("chips").onclick=e=>{
  const b=e.target.closest(".chip");if(!b)return;
  document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));
  gal.querySelectorAll("img").forEach(im=>im.style.display=(b.dataset.f==="all"||im.dataset.c===b.dataset.f)?"":"none");
};
const lb=document.getElementById("lb"),lbi=lb.querySelector("img");
gal.onclick=e=>{if(e.target.tagName==="IMG"){lbi.src=e.target.src;lb.classList.add("show")}};
lb.onclick=()=>lb.classList.remove("show");
document.addEventListener("keydown",e=>{if(e.key==="Escape")lb.classList.remove("show")});

/* ===== Active link + reveal ===== */
const secs=[...document.querySelectorAll("section")],navA=[...links.querySelectorAll("a")];
addEventListener("scroll",()=>{
  let cur=secs[0].id;secs.forEach(s=>{if(scrollY>=s.offsetTop-160)cur=s.id});
  navA.forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+cur));
},{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll(".rv").forEach(el=>io.observe(el));

document.addEventListener("DOMContentLoaded",()=>setLanguage("ar"));
</script>
